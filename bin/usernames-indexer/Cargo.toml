[package]
name = "usernames-indexer"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Indexes IdentityRegistry and HandleEscrow events into Postgres."
publish = false

[dependencies]
usernames-core.workspace = true

alloy.workspace = true
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
humantime.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
usernames-core = { workspace = true, features = ["test-seams"] }
usernames-fixtures.workspace = true
libid-contracts = { workspace = true, features = ["testing"] }
libid-identity.workspace = true
alloy = { workspace = true, features = ["signer-local", "node-bindings"] }
axum.workspace = true
http-body-util = "0.1"
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["process", "io-util"] }
