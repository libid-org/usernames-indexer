[package]
name = "usernames-indexer"
version = "0.7.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Indexes IdentityRegistry and HandleEscrow events into Postgres."
publish = false

[features]
# The crate-private items the suites in `tests/` test, made public.
test-helpers = ["dep:visibility"]

[dependencies]
usernames-core.workspace = true

alloy.workspace = true
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
humantime.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
visibility = { workspace = true, optional = true }

[dev-dependencies]
usernames-indexer = { path = ".", features = ["test-helpers"] }
usernames-core = { workspace = true, features = ["test-helpers"] }
usernames-fixtures.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
