[package]
name = "usernames-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Serves handle/id/address resolution and search over the indexed read model. Reads only; it indexes nothing."
publish = false

[dependencies]
usernames-core.workspace = true
libid-contracts.workspace = true

alloy = { workspace = true, features = ["signer-local"] }
anyhow.workspace = true
axum.workspace = true
hex = "0.4"
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
dotenvy.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
url.workspace = true

[dev-dependencies]
alloy = { workspace = true, features = ["signer-local", "node-bindings"] }
http-body-util = "0.1"
sqlx.workspace = true
tower = { version = "0.5", features = ["util"] }
