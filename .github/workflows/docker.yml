name: Docker

# Build on every PR (packaging must not rot); publish to GHCR from main, from
# release tags, and from any branch on a manual run, tagged
# `branch-<name>` and `sha-<commit>`. GHCR only, GITHUB_TOKEN only: no external
# credentials to leak, and the deployment side pulls by digest or semver tag.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One runtime image per job, each a target of the Dockerfile.
        include:
          - target: indexer
            image: usernames-indexer
          - target: api
            image: usernames-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/$owner/${{ matrix.image }}"
          tags="$image:sha-${GITHUB_SHA::12}"
          case "$GITHUB_REF" in
            refs/tags/v*) tags="$tags,$image:${GITHUB_REF#refs/tags/v},$image:latest" ;;
            refs/heads/main) tags="$tags,$image:main" ;;
            refs/heads/*)
              branch="${GITHUB_REF#refs/heads/}"
              branch="$(printf '%s' "${branch,,}" | tr -c 'a-z0-9._-' '-')"
              tags="$tags,$image:branch-${branch:0:100}"
              ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
