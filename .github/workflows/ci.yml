name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RUST_VERSION: 1.97.1
  NIGHTLY: nightly-2025-07-01
  FOUNDRY_VERSION: v1.7.1

jobs:
  # No cache and no compile: rustfmt parses sources, so this rejects a bad
  # push in seconds.
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `cargo +nightly fmt` is not a preference: .rustfmt.toml sets
      # `imports_granularity` and `imports_layout`, which are nightly-only.
      # Stable rustfmt does not reject them, it IGNORES them — so a stable
      # check would pass code the nightly formatter rewrites.
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rustfmt

      - run: cargo +"$NIGHTLY" fmt --all -- --check

  test:
    name: Clippy and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: usernames
          POSTGRES_USER: usernames
          POSTGRES_PASSWORD: usernames_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usernames -d usernames"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://usernames:usernames_ci@localhost:5432/usernames
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The end-to-end test spawns anvil; without it the test would skip and
      # the suite would quietly stop covering the chain path.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The integration tests need the service database; DATABASE_URL is set
      # job-wide, so nothing here skips.
      - name: Tests
        run: cargo test --all
