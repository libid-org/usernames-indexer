name: DCO

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Every commit is signed off by its author
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            zero="0000000000000000000000000000000000000000"
            if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
              && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$PUSH_BEFORE..$PUSH_AFTER"
            else
              echo "No usable push range; checking only the head commit."
              range="$PUSH_AFTER^!"
            fi
          fi

          missing=0
          for sha in $(git rev-list --no-merges "$range"); do
            author=$(git log -1 --format='%an <%ae>' "$sha")
            if git log -1 --format=%B "$sha" \
              | grep -Fxiq "Signed-off-by: $author"; then
              continue
            fi
            echo "::error::commit $sha lacks Signed-off-by matching its author: $author"
            missing=1
          done
          exit "$missing"
