[workspace]
members = ["bin/*", "crates/*"]
resolver = "3"

[workspace.package]
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/usernames-indexer"

[workspace.dependencies]
usernames-core = { path = "crates/usernames-core" }

alloy = { version = "1", features = ["contract", "providers", "transport-http", "network", "serde"] }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
libid-contracts = "0.6"
libid-identity = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
