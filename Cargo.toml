[workspace]
members = ["bin/*"]
resolver = "3"

[workspace.package]
edition = "2021"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/usernames-indexer"

[workspace.dependencies]
alloy = { version = "1", features = ["contract", "providers", "transport-http", "network", "serde"] }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
libid-contracts = "0.5"
# TODO(release): switch to a crates.io version once libid-contracts cuts a
# release carrying the crate — https://github.com/libid-org/libid-contracts/pull/6.
libid-identity = { git = "https://github.com/libid-org/libid-contracts", branch = "rust-identity-crate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
