# Local development stack: one Postgres the indexer and its tests share.
#
# `docker compose up -d postgres` for the database alone (cargo run against
# it); `docker compose up -d --build` for the full containerized stack —
# indexer included, configured through the environment or a .env file.
services:
  indexer:
    build: .
    environment:
      DATABASE_URL: postgres://usernames:${POSTGRES_PASSWORD:-usernames_dev}@postgres:5432/usernames
      RPC_URL: ${RPC_URL:?set RPC_URL}
      IDENTITY_NAMES_ADDRESS: ${IDENTITY_NAMES_ADDRESS:?set IDENTITY_NAMES_ADDRESS}
      CHAIN_ID: ${CHAIN_ID:-}
      CONFIRMATIONS: ${CONFIRMATIONS:-5}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: usernames
      POSTGRES_USER: usernames
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usernames_dev}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usernames -d usernames"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
