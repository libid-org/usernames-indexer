[package]
name = "usernames-core"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The read model, event decoding and indexing loop behind the usernames indexer and its read API."
publish = false

[features]
# What the suites outside this crate use to stand up states the indexer
# would reach only over time, such as a report that has expired.
test-seams = []

[dependencies]
alloy = { workspace = true, features = ["json-rpc", "provider-ws"] }
alloy-primitives.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono = "0.4"
futures-util = "0.3"
libid-contracts.workspace = true
libid-identity.workspace = true
serde.workspace = true
serde_with.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower = "0.5"
thiserror = "2"
tracing.workspace = true
url.workspace = true

[dev-dependencies]
usernames-core = { workspace = true, features = ["test-seams"] }
usernames-fixtures.workspace = true
libid-profiles.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
http-body-util = "0.1"
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }
