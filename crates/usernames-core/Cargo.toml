[package]
name = "usernames-core"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The read model, event decoding and indexing loop behind the usernames indexer and its read API."
publish = false

[features]
# What the suites outside this crate use to stand up states the indexer
# would reach only over time, such as a report that has expired.
test-seams = []

[dependencies]
alloy.workspace = true
alloy-primitives.workspace = true
anyhow.workspace = true
axum.workspace = true
futures-util = "0.3"
libid-contracts.workspace = true
libid-identity.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror = "2"
tracing.workspace = true

[dev-dependencies]
libid-profiles.workspace = true
alloy = { workspace = true, features = ["node-bindings", "signer-local"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
