[package]
name = "usernames-core"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The read model, event decoding and indexing loop behind the usernames indexer and its read API."
publish = false

[features]
# What the suites outside this crate use to stand up states the indexer
# would reach only over time, such as a report that has expired.
test-helpers = []

[dependencies]
alloy = { workspace = true, features = ["json-rpc", "provider-ws"] }
alloy-primitives.workspace = true
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
futures-util.workspace = true
libid-contracts.workspace = true
libid-identity.workspace = true
serde.workspace = true
serde_with.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
usernames-core = { workspace = true, features = ["test-helpers"] }
usernames-fixtures.workspace = true
libid-profiles.workspace = true
futures-util = { workspace = true, features = ["sink"] }
http-body-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tower = { workspace = true, features = ["util"] }
