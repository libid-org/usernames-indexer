[package]
name = "usernames-core"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The read model, event decoding and indexing loop behind the usernames indexer and its read API."
publish = false

[dependencies]
alloy = { workspace = true, features = ["provider-ws"] }
anyhow.workspace = true
axum.workspace = true
futures = "0.3"
libid-contracts.workspace = true
libid-identity.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror = "2"
tracing.workspace = true
url.workspace = true

[dev-dependencies]
libid-profiles.workspace = true
alloy = { workspace = true, features = ["node-bindings", "rpc-types-anvil", "signer-local"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }
